services:
  mysql:
    image: mysql:8.0
    container_name: adbms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3312:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongodb:
    image: mongo:7.0
    container_name: adbms_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ecommerce_nosql
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: adbms_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "false"
      INIT_DB: "true"
      SECRET_KEY: local-dev-secret-key-change-me
      JWT_SECRET_KEY: local-dev-jwt-secret-change-me
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ecommerce_nosql
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: "*"
      PORT: "5000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: adbms_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
